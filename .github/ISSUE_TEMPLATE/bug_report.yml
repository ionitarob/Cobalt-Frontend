---
name: Bug Report
description: Something is broken
labels: ["bug","needs-triage"]
body:
  - type: input
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [Critical,High,Medium,Low]
    validations:
      required: true
